name: Build Android APK

on:
  push:
    branches:
      - main
      - arena/01a04452-nexora
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run web tests
        run: npm test

      - name: Prepare web assets (www)
        run: |
          mkdir -p www
          cp -r index.html css js icons manifest.webmanifest sw.js www/
          ls www/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias nexora \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nexora2026 -keypass nexora2026 \
            -dname "CN=إدارة البيانات, OU=Dev, O=Nexora, L=Sanaa, ST=Sanaa, C=YE"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: /home/runner/work/Nexora/Nexora/release.keystore
          RELEASE_STORE_PASSWORD: nexora2026
          RELEASE_KEY_ALIAS: nexora
          RELEASE_KEY_PASSWORD: nexora2026
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: List APK output
        run: |
          ls -la android/app/build/outputs/apk/release/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: e4-data-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-android
          name: إدارة البيانات — تطبيق أندرويد v1.0.0
          body: |
            📱 تطبيق **إدارة البيانات** المحاسبي لنظام أندرويد.

            - النسخة الإنتاجية الموقّعة (Release APK)
            - قابل للتثبيت المباشر
            - يعمل دون إنترنت

            **كيفية التثبيت:** حمّل ملف `app-release.apk` من الأسفل، ثم افتحه على هاتفك وفعّل «تثبيت من مصادر غير معروفة».
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Deliver APK via git branch (apk-delivery)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "Authorization: bearer $GITHUB_TOKEN"
          git checkout --orphan apk-delivery
          git rm -rf --quiet . || true
          cp android/app/build/outputs/apk/release/app-release.apk ./app-release.apk
          sha256sum app-release.apk > app-release.apk.sha256
          git add app-release.apk app-release.apk.sha256
          git commit -m "APK delivery — build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f origin HEAD:apk-delivery
