name: nexora_app
description: إدارة البيانات — النظام المحاسبي
publish_to: 'none'
version: 3.1.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6
  archive: ^3.6.1
  open_filex: ^4.5.0
  fl_chart: ^0.69.0
  local_auth: ^2.3.0
  local_auth_android: ^1.0.43
  flutter_contacts: ^1.1.9
  screenshot: ^3.0.0
  math_expressions: ^2.6.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
